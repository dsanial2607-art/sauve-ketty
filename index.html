<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sauve Ketty</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"><div id="adminHotspot" aria-hidden="true"></div>
<section id="intro" class="screen active intro-screen">
    <div class="language-switch" id="languageSwitch">
      <button id="frBtn" class="lang-btn active-lang">🇫🇷 FRANÇAIS</button>
      <button id="enBtn" class="lang-btn">🇬🇧 ENGLISH</button>
    </div>
    <div class="intro-actions">
      <button id="startBtn" class="big-btn">JOUER</button>
      <button id="rulesBtn" class="ghost-btn">RÈGLES</button>
      <button id="settingsBtn" class="ghost-btn" style="display:none">PARAMÈTRES</button>
    </div>
  </section>

  <section id="game" class="screen game-screen">
    <div class="top-left">
      <img class="header" src="header.png" alt="Trouve le bon mot !">
      <button id="hintBtn" class="icon-btn clue"><img src="buttons/hint.png" alt="Indice"></button>
    </div>
    <button id="quitBtn" class="icon-btn quit"><img src="buttons/quit.png" alt="Quitter"></button>
    <div id="word" class="word"></div>
    <div class="battery-wrap"><img id="batteryImg" src="battery/100.png" alt="Batterie"></div>
    <div class="prompt"><span>CHOISIS UNE LETTRE</span><img src="arrows.png" alt=""></div>
    <div id="keyboard" class="keyboard"></div>
    <div id="pepperLine" class="speech-line" aria-live="polite"></div>
  </section>

  <section id="end" class="screen end-screen">
    <img id="endImage" class="end-image" src="sauve_ketty_win.png" alt="Résultat">
    <div id="endText" class="end-text"></div>
    <button id="againBtn" class="big-btn">REJOUER</button>
    <button id="homeBtn" class="ghost-btn">ACCUEIL</button>
  </section>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card settings-card">
      <h2 id="settingsTitle">Réglages Ketty</h2>
      <div class="volume-row"><label id="voiceLabel">🗣 Voix de Ketty</label><input id="voiceVolume" type="range" min="0" max="100"><span id="voiceValue"></span></div>
      <div class="volume-row"><label id="sfxLabel">🔔 Effets sonores</label><input id="sfxVolume" type="range" min="0" max="100"><span id="sfxValue"></span></div>
      <div class="volume-row"><label id="musicLabel">🎵 Musique</label><input id="musicVolume" type="range" min="0" max="100"><span id="musicValue"></span></div>
      <div class="voice-status" id="voiceStatus"></div>
      <div class="settings-buttons"><button id="testVoice">▶ Tester la voix</button><button id="testSound">▶ Tester le son</button><button id="closeSettings">FERMER</button></div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div id="modalExtra"></div>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>
</div>

<audio id="music" src="sounds_mp3/playful_music.mp3" loop preload="auto"></audio>
<audio id="sfxGood" src="sounds_mp3/hoomano_sfx_good_answer.mp3" preload="auto"></audio>
<audio id="sfxWin" src="sounds_mp3/hoomano_sfx_victory_1.mp3" preload="auto"></audio>
<audio id="sfxLose" src="sounds_mp3/hoomano_sfx_lose_game.mp3" preload="auto"></audio>
<audio id="sfxTimer" src="sounds_mp3/hoomano_sfx_timer_5s.mp3" preload="auto"></audio>
<audio id="sfxHint" src="sounds_mp3/hoomano_sfx_help_button.mp3" preload="auto"></audio>
<audio id="sfxLife" src="sounds_mp3/hoomano_sfx_lose_life.mp3" preload="auto"></audio>
<audio id="sfxQuit" src="sounds_mp3/hoomano_sfx_quit_app.mp3" preload="auto"></audio>
<audio id="voicePlayer" preload="auto"></audio>
<script src="game.js"></script>
</body>
</html>
